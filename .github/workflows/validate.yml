name: validate

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  registry:
    name: action registry, profiles, coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Registry is well-formed (10 fields, risk/tier/human/status valid)
        run: python3 tools/actions.py

      - name: Every profile op maps to a registry row, risk not lowered, verify present
        run: python3 tools/profiles.py

      - name: Coverage audit (thin domains, family gaps, orphan verbs)
        run: python3 tools/audit_actions.py

      - name: Eval plan is generated for every action
        run: python3 tools/evals.py

      - name: App target catalogue (tier A ⇒ profile exists)
        run: python3 tools/app_targets.py

      - name: Skills reference real registry rows, risk matches, done criteria present
        run: python3 tools/skills.py

      - name: Hands (data/tools.json) reference real registry rows and allowed risk
        run: python3 tools/hands.py

      - name: Flows (data/flows.json) chain real tools and never understate risk
        run: python3 tools/flows.py

      - name: Ecosystem catalogues (10 catalogues, >=200 each, ids unique, statuses honest)
        run: |
          python3 tools/build_ecosystem.py
          python3 tools/ecosystem.py

      - name: AGENTS.md status block matches the data
        run: python3 tools/status.py --check

      - name: Dashboard and document index match the data
        run: python3 tools/dashboard.py

      - name: Relative links in the documentation resolve
        run: python3 tools/links.py

      # Шаг 178: политика риска живёт в Rust и расширяется одной строкой. Ни
      # сборка, ни тесты интерфейса на это не смотрят — смотрит эта проверка.
      - name: Risk policy did not quietly widen (deny/confirm/allow per risk)
        run: python3 tools/policy_drift.py --quiet

      # План — тоже данные, и он уже расходился: 516 строк при 500 номерах (под
      # одним номером стояли исходная формулировка и отчёт).
      - name: The plan has exactly 500 steps, no number twice
        run: python3 tools/plan_progress.py --strict --quiet

      - name: SPDX SBOM can be built from both lockfiles
        run: python3 tools/sbom.py --check

      # Шаг 209: тот же коммит — тот же набор файлов. Сборка SBOM дважды и
      # побайтное сравнение: обещание «воспроизводимо» проверяется, а не пишется.
      - name: SBOM is reproducible (same commit, same bytes)
        run: python3 tools/sbom.py --reproducible

      # Шаг 214: единственная дверь в сеть ещё не значит, что в неё не входят
      # сами. Проверка ищет загрузку внутри `useEffect` и в таймерах.
      - name: Downloads happen only on an explicit press
        run: |
          python3 tools/no_silent_download.py --selftest
          python3 tools/no_silent_download.py --quiet

      # Шаг 217: одна таблица лицензий всего встроенного, собранная из блокировок.
      # Проверяется, что файлы на месте и сумма сходится с общим числом.
      - name: License table is present and adds up
        run: |
          python3 tools/licenses.py --selftest
          python3 tools/licenses.py --check

      # Шаг 218: «никаких рекомендованных платных сервисов» — правило в коде, а не
      # в комментарии. Одна кнопка «Попробовать Pro» собирает витрину.
      - name: No storefront in the interface
        run: |
          python3 tools/no_storefront.py --selftest
          python3 tools/no_storefront.py --quiet

      # Шаг 251: evals одной командой, с отчётом «прошло/не прошло» и причиной.
      - name: Evals pass
        run: |
          python3 tools/run_evals.py --selftest
          python3 tools/run_evals.py --quiet

      # Шаг 255: «что не покрыто» — списком имён и по опасности, а не процентом,
      # по которому нельзя пойти и дописать тест.
      - name: Dangerous code has a neighbouring test
        run: |
          python3 tools/test_gaps.py --selftest
          python3 tools/test_gaps.py --quiet

      # Шаг 254: любой закрытый дефект обязан иметь тест, названный его номером —
      # в обе стороны, иначе тест защищает то, о чём никто не знает.
      - name: Every closed defect has a test named after it
        run: |
          python3 tools/defects.py --selftest
          python3 tools/defects.py --list

      - name: UIA draft generator works on a fixture dump
        run: python3 tools/uia_probe.py draft --dump tests/fixtures/uia_dump.json --out /tmp/draft.json

      - name: Generated artefacts are committed and up to date
        run: |
          git diff --exit-code -- data/actions.json docs/ACTIONS.md docs/PROFILES.md docs/COVERAGE.md docs/EVALS.md docs/APP-COVERAGE.md docs/SKILLS.md docs/ECOSYSTEM.md docs/DASHBOARD.md docs/INDEX.md data/evals.json data/ecosystem AGENTS.md \
            || { echo "::error::generated files are stale — run python3 tools/check_all.py and commit"; exit 1; }

      - name: Summary
        run: |
          {
            echo "### ZShelper registry"
            echo ""
            echo '```'
            python3 - <<'PY'
          import json
          from collections import Counter
          rows = json.load(open("data/actions.json"))
          print(f"actions: {len(rows)}")
          print(f"domains: {len({r['domain'] for r in rows})}")
          print(f"verbs:   {len({r['verb'] for r in rows})}")
          print("risk:   ", dict(Counter(r["risk"] for r in rows)))
          print("status: ", dict(Counter(r["status"] for r in rows)))
          PY
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
