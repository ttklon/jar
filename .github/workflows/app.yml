name: app

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  # нужно, чтобы публиковать дифф форматирования отдельной проверкой
  checks: write

jobs:
  web:
    name: ui (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (registry invariants, UI smoke)
        run: npm test

      - name: Build frontend
        run: npm run build

  rust:
    name: core (cargo check + tests, Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Tauri проверяет наличие frontendDist при сборке, поэтому фронтенд
      # собирается до вызова cargo.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # Вывод компилятора пишем в файл и превращаем в аннотации: логи джобов
      # доступны не всегда, а аннотации читаются через API в любом случае.
      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          {
            echo "pwd: $(pwd)"
            echo "cargo: $(command -v cargo || echo НЕ НАЙДЕН)"
            cargo --version
          } > clippy.log 2>&1
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings >> clippy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Clippy report
        if: always()
        shell: bash
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_annotate.py clippy.log

      - name: Clippy gate
        if: steps.clippy.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::clippy завершился с ошибками (см. аннотации выше)"
          exit 1

      - name: Tests (реестр встроен в бинарник)
        if: steps.clippy.outputs.status == '0'
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # rustfmt детерминирован: если файлы не отформатированы, показываем патч
      # аннотациями — их видно даже там, где логи джоб недоступны.
      - name: Rustfmt
        if: steps.clippy.outputs.status == '0'
        shell: bash
        run: |
          set +e
          cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check > fmt.log 2>&1
          status=$?
          if [ "$status" -ne 0 ]; then
            cargo fmt --manifest-path src-tauri/Cargo.toml --all
            git diff -- src-tauri/src src-tauri/build.rs > fmt.diff
            python scripts/ci_annotate.py fmt.diff --raw
            python scripts/ci_check_report.py --name rustfmt-diff --title "rustfmt" --file fmt.diff
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            exit 1
          fi
