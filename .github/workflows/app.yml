name: app

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish a GitHub pre-release from this commit
        type: boolean
        required: true
        default: false
      runtime_smoke:
        description: Download ~1 GB pinned model/runtime and execute conversation smoke on Windows runner
        type: boolean
        required: false
        default: false
      network_probe:
        description: Ask GitHub/Hugging Face what each catalog address answers (headers only, no download)
        type: boolean
        required: false
        default: false
      release_tag:
        description: Release tag (must match the app version, for example v0.1.0)
        type: string
        required: false
  workflow_call:
  release:
    types: [published]

permissions:
  contents: write
  checks: write

jobs:
  sbom:
    name: dependency inventory (SPDX 2.3)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - name: Build SPDX from npm and Cargo lockfiles
        run: python3 tools/sbom.py --output dist/zshelper.spdx.json

      - name: Record SBOM checksum
        run: |
          digest=$(sha256sum dist/zshelper.spdx.json | cut -d' ' -f1)
          {
            echo "### Dependency SBOM"
            echo ""
            echo "Artifact: \`zshelper-sbom/zshelper.spdx.json\`"
            echo "SHA-256: \`$digest\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest SBOM provenance
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/zshelper.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: zshelper-sbom
          path: dist/zshelper.spdx.json
          if-no-files-found: error
          retention-days: 14

  web:
    name: ui (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (registry invariants, UI smoke)
        run: npm test

      - name: Build frontend
        run: npm run build

  # Шаг 257: снимок отчёта в артефактах — чтобы сравнивать **версии**, а не
  # только править код. В CI уже лежали сборка, снимки экрана и SBOM, а отчёта
  # не было: на «что изменилось между 1.1.0 и 1.2.0» отвечал diff кода — он
  # говорит, что правили, и молчит о том, что изменилось для человека.
  report:
    name: report snapshot (for comparing versions)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Снять отчёт и сверить с репозиторием
        run: |
          python3 tools/report_snapshot.py --write
          python3 tools/report_snapshot.py --check
      - name: Сохранить снимок отчёта
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-snapshot
          path: data/report.json
          # Снимок нужен, чтобы сравнивать версии: он должен пережить сам прогон
          # и следующую ночь.
          retention-days: 90
          if-no-files-found: error

  voice-simulation:
    name: voice simulation (Windows Chromium, virtual microphone)
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Install test browser (not a user runtime)
        run: npx playwright install chromium
      - name: Virtual microphone and dialogue contract simulation
        run: npm run test:voice-simulation
      # Причина падения иначе остаётся только в артефакте, а артефакт в
      # песочнице не скачать: красный прогон говорит «1 failed» и молчит о том,
      # какое ожидание не совпало. Печатаем отчёт в вывод — он читается через
      # API аннотаций/логов.
      - name: Show simulation report
        if: failure()
        shell: pwsh
        run: |
          # HTML-отчёт целиком в лог не влезет: печатаем текстовые следы падения
          # (error-context.md и .txt), где видно несовпавшее ожидание.
          $files = Get-ChildItem -Recurse artifacts -Include error-context.md,*.txt -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -lt 20000 } | Select-Object -First 5
          if (-not $files) { Write-Host 'no text failure context found' }
          foreach ($f in $files) {
            Write-Host ("=== " + $f.FullName)
            Get-Content -LiteralPath $f.FullName | Select-Object -First 80 | ForEach-Object { Write-Host $_ }
          }
      - name: Upload simulation evidence (no real user audio)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voice-simulation-windows
          path: |
            artifacts/voice-report
            artifacts/voice-simulation
          if-no-files-found: error
          retention-days: 14

  # Спайк релиза из `RUNTIME.md` §5: приложение должно не только компилироваться в
  # dev-профиле, но и собираться в release с установщиком. Делается на push, а не на
  # каждом pull request: release-сборка с LTO идёт десятки минут.
  bundle:
    name: release (installer, Windows)
    if: github.event_name == 'push' || github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Кеш пишем только из основной ветки: иначе каждая рабочая ветка заводит свою
      # копию на полгигабайта, и хранилище кончается за неделю. Читать кеш можно всегда.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: npm ci

      # Вывод сборки превращается в аннотации: логи джоб недоступны, аннотации — да.
      # Аннотации из шага, который сам упал, до API не доходят (проверено), поэтому
      # три шага: run → report (`continue-on-error`) → gate.
      # Бандлер Tauri скачивает себе NSIS с внешнего хранилища, и оно регулярно
      # отвечает 504. Это не наш код, но из-за него релиз «красный» через раз —
      # поэтому три попытки, и только на 504: остальные ошибки повторять незачем.
      - name: Build installers (NSIS + MSI)
        id: bundle
        continue-on-error: true
        shell: bash
        run: |
          for attempt in 1 2 3; do
            echo "попытка $attempt"
            if npm run tauri build > bundle.log 2>&1; then
              exit 0
            fi
            if ! grep -q "http status: 504" bundle.log; then
              exit 1
            fi
            sleep 20
          done
          exit 1

      # `continue-on-error` здесь не для красоты: упавший отчёт делает `success()`
      # ложным, и гейт ниже молча пропускается — сборка «зелёная» без установщика.
      - name: Report bundle errors
        if: steps.bundle.outcome == 'failure'
        shell: bash
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          tail -120 bundle.log
          python scripts/ci_log_annotate.py bundle.log --title "tauri build" \
            --grep "error|Error|ERROR|failed|panicked" --tail 40 --max 8

      - name: Installer gate
        if: steps.bundle.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Installer artifacts
        if: steps.bundle.outcome == 'success'
        shell: bash
        run: |
          # Собирается только то, что названо в tauri.conf.json. Здесь стоял
          # жёсткий `ls .../bundle/msi`, а конфиг с шага 239 собирает **только**
          # NSIS (MSI не умеет установку без прав администратора). Шаг падал на
          # отсутствующей папке — уже после того, как установщик успешно собрался,
          # и красный прогон выглядел как «сборка не работает».
          for target in nsis msi; do
            dir="src-tauri/target/release/bundle/$target"
            if [ -d "$dir" ]; then
              echo "== $target"
              ls -la "$dir"
            else
              echo "== $target: не собирался (не в tauri.conf.json)"
            fi
          done
          # Установщик обязан существовать: без него шаг бессмыслен.
          ls src-tauri/target/release/bundle/nsis/*.exe

      # Портативная сборка — тот же exe, но без установки: положил в папку и запустил.
      # Чего она НЕ делает, сказано в файле рядом: WebView2 нужен системный, а данные
      # всё равно живут в %LOCALAPPDATA%, поэтому «портативная» не значит «ничего не
      # оставляет на диске».
      - name: Portable package (zip)
        if: steps.bundle.outcome == 'success'
        shell: bash
        run: |
          mkdir -p dist/portable
          cp src-tauri/target/release/zshelper.exe dist/portable/
          # Текст читай-файла лежит в репозитории: его видно в ревью и не надо
          # экранировать в YAML.
          cp scripts/portable-readme.txt dist/portable/ЧИТАЙ.txt
          cd dist/portable
          powershell -NoProfile -Command "Compress-Archive -Path 'zshelper.exe','ЧИТАЙ.txt' -DestinationPath '../zshelper-portable.zip' -Force"
          cd ../..
          ls -la dist

      - name: Create release manifest
        if: steps.bundle.outcome == 'success'
        shell: bash
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          node scripts/release-manifest.mjs
          # Манифест обещает sha256 — значит его надо сверить с файлами, а не
          # только напечатать. `--verify` читает каждый артефакт заново и
          # сравнивает размер и хеш.
          #
          # Верификатор ищет файлы рядом с манифестом, а установщик лежит в
          # src-tauri/target/release/bundle/nsis. Поэтому артефакты заранее
          # складываются в dist/ — рядом с манифестом, откуда их и забирают
          # загрузка артефактов и релиз.
          cp src-tauri/target/release/bundle/nsis/*.exe dist/
          node scripts/release-manifest.mjs --verify dist/zshelper-release.json

      # Контрольные суммы печатаются в сводку прогона: скачанный файл можно сверить,
      # не доверяя ни каналу, ни дате.
      - name: Checksums
        if: steps.bundle.outcome == 'success'
        shell: bash
        run: |
          {
            echo "### Установщики и портативная сборка"
            echo ""
            echo "| файл | sha256 |"
            echo "| --- | --- |"
            for file in src-tauri/target/release/bundle/nsis/*.exe \
                        src-tauri/target/release/bundle/msi/*.msi \
                        dist/zshelper-portable.zip; do
              [ -f "$file" ] || continue
              echo "| \`$(basename "$file")\` | \`$(sha256sum "$file" | cut -d' ' -f1)\` |"
            done
            echo ""
            echo "Манифест: \`zshelper-release.json\` (SHA-256 \`$(sha256sum dist/zshelper-release.json | cut -d' ' -f1)\`)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest installer and portable package provenance
        if: steps.bundle.outcome == 'success'
        uses: actions/attest-build-provenance@v2
        with:
          # Только то, что действительно собирается: MSI в конфиге нет, а
          # отсутствующий путь валит аттестацию целиком.
          subject-path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/zshelper-portable.zip
            dist/zshelper-release.json

      # Живой прогон на настоящей Windows: реестр, файловая система, WebView2 и —
      # если установщик собрался — установка, запуск без администратора, удаление.
      # Это не приёмка пользователем: микрофон, голос, OUTLOOK и сторонние
      # приложения сюда не входят, и скрипт об этом говорит сам.
      - name: Live Windows checks (registry, filesystem, installer)
        if: steps.bundle.outcome == 'success'
        shell: pwsh
        run: |
          # ASCII ONLY in this block, on purpose.
          # Six runs proved that a non-ASCII `run:` block can die before its first
          # line on Windows PowerShell 5.1 -- no log, no artefact, no reason.
          # All Russian text lives in scripts/test-live-windows.ps1 (UTF-8 + BOM),
          # which is run as a child process so its `exit` cannot kill this host.
          $ErrorActionPreference = 'Continue'
          'STEP-STARTED' | Out-File -FilePath live-windows-step.log -Encoding utf8
          & powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-live-windows.ps1 *>&1 |
            Out-File -FilePath live-windows-step.log -Append -Encoding utf8
          $code = $LASTEXITCODE
          Get-Content -LiteralPath live-windows-step.log | Write-Host
          # Artefact downloads are blocked from the dev sandbox, and job logs are
          # not served by the API, so the only readable evidence channel is the
          # annotations API. Emit every PASS/FAIL/SKIP line and the self-check
          # verdict as notices (GitHub keeps up to 10 per step).
          $marks = @(Select-String -LiteralPath live-windows.log -Pattern '^(PASS|FAIL|SKIP)|SELF-CHECK' -ErrorAction SilentlyContinue |
            ForEach-Object { $_.Line })
          $shown = $marks | Select-Object -First 9
          foreach ($m in $shown) { Write-Host ("::notice::{0}" -f $m) }
          if ($marks.Count -gt 9) {
            Write-Host ("::notice::... {0} more check lines, see live-windows.log" -f ($marks.Count - 9))
          }
          if ($code -ne 0) {
            $marks = Select-String -LiteralPath live-windows.log -Pattern '^(PASS|FAIL|SKIP)' -ErrorAction SilentlyContinue |
              ForEach-Object { $_.Line }
            $summary = if ($marks) { $marks -join ' ; ' } else { 'no PASS/FAIL lines in live-windows.log' }
            Write-Host ("::error::live windows failed code={0} :: {1}" -f $code, $summary)
            exit $code
          }
          Write-Host 'live windows: all checks passed'
      - name: Upload live Windows evidence
        if: always() && steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: live-windows-evidence
          path: |
            live-windows.log
            live-windows-step.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installers and portable
        if: steps.bundle.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: zshelper-windows
          # MSI не собирается (см. tauri.conf.json: установка без прав
          # администратора есть только у NSIS). Путь к несуществующему файлу
          # при if-no-files-found: error валит загрузку целиком.
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            dist/zshelper-portable.zip
            dist/zshelper-release.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub pre-release
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          expected="v${version}"
          if [ -z "$RELEASE_TAG" ] || [ "$RELEASE_TAG" != "$expected" ]; then
            echo "release_tag must equal the application version: $expected" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            src-tauri/target/release/bundle/nsis/*.exe \
            dist/zshelper-portable.zip \
            dist/zshelper-release.json \
            --target "$GITHUB_SHA" \
            --title "ZShelper $RELEASE_TAG — ранняя альфа" \
            --prerelease \
            --notes "Проверочная Windows-сборка из GitHub Actions. Это ранняя альфа, не стабильный релиз. Перед установкой сохраните важные данные. Автообновление в приложении пока не реализовано. Проверьте SHA-256 по zshelper-release.json; GitHub provenance не является Authenticode-подписью."

      - name: Attach assets to published GitHub release
        if: github.event_name == 'release' && github.event.action == 'published'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          expected="v${version}"
          if [ "$RELEASE_TAG" != "$expected" ]; then
            echo "release tag $RELEASE_TAG does not match app version $expected" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" \
            src-tauri/target/release/bundle/nsis/*.exe \
            dist/zshelper-portable.zip \
            dist/zshelper-release.json \
            --clobber

  rust:
    name: core (cargo check + tests, Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # токен нужен, чтобы CI мог запушить коммит форматирования в ветку
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      # Кеш пишем только из основной ветки: иначе каждая рабочая ветка заводит свою
      # копию на полгигабайта, и хранилище кончается за неделю. Читать кеш можно всегда.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Tauri проверяет наличие frontendDist при сборке, поэтому фронтенд
      # собирается до вызова cargo.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # Вывод компилятора пишем в файл и превращаем в аннотации: логи джобов
      # доступны не всегда, а аннотации читаются через API в любом случае.
      - name: Runtime archive attack tests (no binary execution)
        shell: powershell
        run: ./scripts/test-runtime-installer.ps1

      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          {
            echo "pwd: $(pwd)"
            echo "cargo: $(command -v cargo || echo НЕ НАЙДЕН)"
            cargo --version
          } > clippy.log 2>&1
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings >> clippy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Clippy report
        if: always()
        shell: bash
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_annotate.py clippy.log

      - name: Clippy gate
        if: steps.clippy.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::clippy завершился с ошибками (см. аннотации выше)"
          exit 1

      # Как и у clippy: сначала прогон пишет лог, потом отдельный шаг превращает его
      # в аннотации, и только третий валит сборку. Аннотации из шага, который сам
      # завершился ошибкой, до API не доходят.
      - name: Tests (реестр встроен в бинарник)
        id: tests
        if: steps.clippy.outputs.status == '0'
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml > tests.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Tests report
        if: always() && steps.tests.outputs.status != '0'
        shell: bash
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/ci_log_annotate.py tests.log --title "cargo test" \
            --grep "FAILED|panicked|overflowed|stack overflow|SIGABRT|abort|---- |assertion|failures:|error\[|провал|не удал|ошибк" \
            --after 2 --max 10

      - name: Tests gate
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::cargo test упал — подробности в аннотациях выше"
          exit 1

      # Замер старта и памяти на подставном профиле (шаги 390/391). Отдельным шагом,
      # потому что `cargo test` без `--nocapture` прячет `println!`: замер, которого
      # никто не видит, — это не замер. Цифры идут в сводку рядом со своими порогами.
      - name: Start and memory numbers
        id: numbers
        if: steps.tests.outputs.status == '0'
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml perf:: -- --nocapture > perf.log 2>&1
          code=$?
          if grep -q "PERF " perf.log; then
            {
              echo "### Старт и память (подставной профиль, шаги 390/391)"
              grep "PERF " perf.log
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "PERF замер не напечатал ни одной строки" >> perf.log
            code=1
          fi
          echo "status=$code" >> "$GITHUB_OUTPUT"

      - name: Numbers failure report
        if: always() && steps.numbers.outputs.status != '' && steps.numbers.outputs.status != '0'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_log_annotate.py perf.log --title "замер старта и памяти" --grep "PERF |FAILED|panicked|assertion" --after 3 --max 20

      - name: Numbers gate
        if: steps.numbers.outputs.status != '' && steps.numbers.outputs.status != '0'
        shell: bash
        run: exit 1

      - name: Pinned runtime conversation smoke (explicit network/execution consent)
        if: steps.tests.outputs.status == '0' && ((github.event_name == 'workflow_dispatch' && inputs.runtime_smoke) || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/') && contains(github.event.head_commit.message, '[runtime-smoke]')))
        id: runtime_smoke
        shell: bash
        env:
          ZSHELPER_RUNTIME_SMOKE: "1"
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml pinned_runtime_conversation_smoke -- --ignored --nocapture > runtime-smoke.log 2>&1
          code=$?
          # cargo test can exit 0 when a filter matches no tests. Require the final
          # milestone, emitted only after real inference, stop and removal assertions.
          if [ "$code" = 0 ] && ! grep -Fq "RUNTIME_SMOKE process stopped; managed runtime removed; model preserved" runtime-smoke.log; then
            echo "RUNTIME_SMOKE did not complete all milestones" >> runtime-smoke.log
            code=1
          fi
          echo "status=$code" >> "$GITHUB_OUTPUT"
          grep "RUNTIME_SMOKE" runtime-smoke.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Runtime smoke failure report
        if: always() && steps.runtime_smoke.outputs.status != '' && steps.runtime_smoke.outputs.status != '0'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_log_annotate.py runtime-smoke.log --title "pinned runtime smoke" --grep "FAILED|panicked|RUNTIME_SMOKE|error|Error" --after 4 --max 20

      - name: Runtime smoke gate
        if: steps.runtime_smoke.outputs.status != '' && steps.runtime_smoke.outputs.status != '0'
        shell: bash
        run: exit 1

      # Живой прогон сети: каждый адрес каталога спрашивается по-настоящему —
      # код ответа, размер, ETag. Ничего не скачивается (`--head`), поэтому шаг
      # стоит секунды и годится для обычной проверки, а не только для ручной.
      - name: Live network probe (headers only, explicit consent)
        if: steps.tests.outputs.status == '0' && ((github.event_name == 'workflow_dispatch' && inputs.network_probe) || github.event_name == 'push')
        id: network_probe
        shell: bash
        env:
          ZSHELPER_NETWORK_PROBE: "1"
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml every_catalog_address_really_answers -- --ignored --nocapture > network-probe.log 2>&1
          code=$?
          # Фильтр, не нашедший ни одного теста, тоже даёт 0 — требуем финальную
          # строку, которая печатается только после проверки всех четырёх адресов.
          if [ "$code" = 0 ] && ! grep -Fq "NETWORK_PROBE all four catalog addresses answered with the pinned size" network-probe.log; then
            echo "NETWORK_PROBE did not reach the final milestone" >> network-probe.log
            code=1
          fi
          echo "status=$code" >> "$GITHUB_OUTPUT"
          grep "NETWORK_PROBE" network-probe.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Network probe failure report
        if: always() && steps.network_probe.outputs.status != '' && steps.network_probe.outputs.status != '0'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_log_annotate.py network-probe.log --title "live network probe" --grep "NETWORK_PROBE|panicked|адрес|размер|error" --after 3 --max 20

      - name: Network probe gate
        if: steps.network_probe.outputs.status != '' && steps.network_probe.outputs.status != '0'
        shell: bash
        run: exit 1

      # У разработчика может не быть Rust-тулчейна (песочница, новая машина), а
      # форматирование детерминировано. Поэтому ветку чинит сам CI отдельным
      # коммитом, а не человек, вручную правящий отступы по диффу из аннотаций.
      - name: Rustfmt
        if: steps.clippy.outputs.status == '0'
        shell: bash
        env:
          PYTHONIOENCODING: utf-8
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          # Смотрим только исходники: cargo build переписывает Cargo.lock и раньше
          # выдавал это за «код не отформатирован».
          if git diff --quiet -- src-tauri/src src-tauri/build.rs; then
            echo "форматирование в порядке"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            git diff -- src-tauri
            echo "::error::файлы не отформатированы — запусти cargo fmt"
            exit 1
          fi
          # Форматирование меняет число строк в ядре, а дашборд это число печатает.
          # Без пересборки следующий прогон ругался бы «сгенерированные файлы устарели»
          # из-за отступов — и это выглядело бы как отдельная поломка.
          python tools/dashboard.py
          git config user.name "zshelper-ci"
          git config user.email "ci@zshelper.local"
          git add src-tauri/src src-tauri/build.rs src-tauri/Cargo.lock docs/DASHBOARD.md docs/INDEX.md
          git commit -m "style: cargo fmt + пересчёт дашборда (автоматически, CI)"
          git push
          # На push это предупреждение, а не красная сборка: код уже починен ботом, тесты
          # прошли, и человеку не нужно чинить отступы руками. Красный прогон должен
          # значить «не собирается или тесты упали» — иначе цвет перестаёт что-то значить.
          echo "::warning::CI отформатировал код и запушил коммит — подтяни его (git pull --rebase)"
          exit 0
