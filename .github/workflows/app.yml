name: app

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  checks: write

jobs:
  web:
    name: ui (typecheck, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests (registry invariants, UI smoke)
        run: npm test

      - name: Build frontend
        run: npm run build

  # Спайк релиза из `RUNTIME.md` §5: приложение должно не только компилироваться в
  # dev-профиле, но и собираться в release с установщиком. Делается на push, а не на
  # каждом pull request: release-сборка с LTO идёт десятки минут.
  bundle:
    name: release (installer, Windows)
    if: github.event_name == 'push'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      # Вывод сборки превращается в аннотации: логи джоб недоступны, аннотации — да.
      # Аннотации из шага, который сам упал, до API не доходят (проверено), поэтому
      # три шага: run → report (`continue-on-error`) → gate.
      - name: Build installer (NSIS)
        id: bundle
        continue-on-error: true
        shell: bash
        run: npm run tauri build > bundle.log 2>&1

      - name: Report bundle errors
        if: steps.bundle.outcome == 'failure'
        shell: bash
        run: |
          tail -120 bundle.log
          python scripts/ci_log_annotate.py bundle.log --title "tauri build" \
            --grep "error|Error|ERROR|failed|panicked" --tail 40 --max 8

      - name: Installer gate
        if: steps.bundle.outcome == 'failure'
        shell: bash
        run: exit 1

      - name: Installer artifacts
        if: steps.bundle.outcome == 'success'
        shell: bash
        run: ls -la src-tauri/target/release/bundle/nsis

  rust:
    name: core (cargo check + tests, Windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          # токен нужен, чтобы CI мог запушить коммит форматирования в ветку
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      # Tauri проверяет наличие frontendDist при сборке, поэтому фронтенд
      # собирается до вызова cargo.
      - name: Build frontend
        run: |
          npm ci
          npm run build

      # Вывод компилятора пишем в файл и превращаем в аннотации: логи джобов
      # доступны не всегда, а аннотации читаются через API в любом случае.
      - name: Clippy
        id: clippy
        shell: bash
        run: |
          set +e
          {
            echo "pwd: $(pwd)"
            echo "cargo: $(command -v cargo || echo НЕ НАЙДЕН)"
            cargo --version
          } > clippy.log 2>&1
          cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings >> clippy.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Clippy report
        if: always()
        shell: bash
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: python scripts/ci_annotate.py clippy.log

      - name: Clippy gate
        if: steps.clippy.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::clippy завершился с ошибками (см. аннотации выше)"
          exit 1

      # Как и у clippy: сначала прогон пишет лог, потом отдельный шаг превращает его
      # в аннотации, и только третий валит сборку. Аннотации из шага, который сам
      # завершился ошибкой, до API не доходят.
      - name: Tests (реестр встроен в бинарник)
        id: tests
        if: steps.clippy.outputs.status == '0'
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml > tests.log 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Tests report
        if: always() && steps.tests.outputs.status != '0'
        shell: bash
        continue-on-error: true
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/ci_log_annotate.py tests.log --title "cargo test" \
            --grep "FAILED|panicked|---- |assertion|left|right" --max 8

      - name: Tests gate
        if: steps.tests.outputs.status != '0'
        shell: bash
        run: |
          echo "::error::cargo test упал — подробности в аннотациях выше"
          exit 1

      # У разработчика может не быть Rust-тулчейна (песочница, новая машина), а
      # форматирование детерминировано. Поэтому ветку чинит сам CI отдельным
      # коммитом, а не человек, вручную правящий отступы по диффу из аннотаций.
      - name: Rustfmt
        if: steps.clippy.outputs.status == '0'
        shell: bash
        run: |
          cargo fmt --manifest-path src-tauri/Cargo.toml --all
          # Смотрим только исходники: cargo build переписывает Cargo.lock и раньше
          # выдавал это за «код не отформатирован».
          if git diff --quiet -- src-tauri/src src-tauri/build.rs; then
            echo "форматирование в порядке"
            exit 0
          fi
          if [ "${{ github.event_name }}" != "push" ]; then
            git diff -- src-tauri
            echo "::error::файлы не отформатированы — запусти cargo fmt"
            exit 1
          fi
          git config user.name "zshelper-ci"
          git config user.email "ci@zshelper.local"
          git add src-tauri/src src-tauri/build.rs src-tauri/Cargo.lock
          git commit -m "style: cargo fmt (автоматически, CI)"
          git push
          echo "::error::CI отформатировал код и запушил коммит — подтяни его (git pull --rebase)"
          exit 1
