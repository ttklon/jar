# Ночной прогон: те же проверки, что на каждом пуше, но по расписанию.
#
# Зачем отдельно. Пуш-прогоны отвечают на вопрос «не сломал ли я только что»; ночной —
# на другой: «не сломалось ли само». Ломается само чаще, чем кажется: тесты, зависящие
# от живого Windows (службы, автозапуск, ffmpeg), гоняются на обновляемом образе раннера;
# реестр и документы расходятся после правок руками; а проверки обещаний («Проверка себя»)
# зависят от машины, а не от кода.
#
# Принципы:
#  * те же проверки, а не «свои»: вызываются уже существующие workflow через workflow_call,
#    чтобы ночной прогон не разошёлся с обычным и не начал жить своей жизнью;
#  * ничего не публикуется и не удаляется: только чтение репозитория и запуск тестов;
#  * падение видно сразу: job называется `nightly`, и красный крестик в списке прогонов —
#    это и есть отчёт.

name: nightly

on:
  schedule:
    # 03:40 UTC — до утренних коммитов и после ночной уборки хранилища.
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  app:
    name: nightly · ядро и интерфейс
    uses: ./.github/workflows/app.yml
  validate:
    name: nightly · данные и документы
    uses: ./.github/workflows/validate.yml

  # Шаг 256: живой сценарий на Windows — по расписанию и **с сохранением
  # результата в историю**.
  #
  # Дефект, который это закрывает. Ночной прогон уже вызывал `app.yml`, а в нём
  # есть живой прогон на Windows (Chromium с виртуальным микрофоном). Но результат
  # жил 14 дней как артефакт и **никуда не копился**: «упало сегодня» видно, а
  # «стало падать, а раньше проходило» — нет. Артефакт без истории отвечает на
  # вопрос «прошло ли», а спрашивают другое: «когда перестало».
  #
  # Поэтому после прогона пишется строка истории: дата, коммит, что было.
  history:
    name: nightly · история живого прогона
    needs: [app, validate]
    # `always()`: строка истории нужна и тогда, когда прогон упал — особенно
    # тогда. Иначе в истории будут только успешные ночи, и «когда перестало»
    # окажется «никогда».
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Записать, чем кончилась ночь
        env:
          APP: ${{ needs.app.result }}
          VALIDATE: ${{ needs.validate.result }}
        run: python3 tools/nightly_history.py --app "$APP" --validate "$VALIDATE"
      - name: Сохранить историю в репозитории
        run: |
          git config user.name "zshelper-ci"
          git config user.email "ci@zshelper.invalid"
          git add data/nightly.jsonl
          git diff --staged --quiet || git commit -m "ночная история: $(date -u +%Y-%m-%d)"
          git push
      - name: Снимок истории в артефакты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-history
          path: data/nightly.jsonl
          if-no-files-found: warn
          # Дольше, чем у прогона: история нужна, чтобы сравнивать версии, а не
          # чтобы разбирать одну ночь.
          retention-days: 90
