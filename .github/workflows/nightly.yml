# Ночной прогон: те же проверки, что на каждом пуше, но по расписанию.
#
# Зачем отдельно. Пуш-прогоны отвечают на вопрос «не сломал ли я только что»; ночной —
# на другой: «не сломалось ли само». Ломается само чаще, чем кажется: тесты, зависящие
# от живого Windows (службы, автозапуск, ffmpeg), гоняются на обновляемом образе раннера;
# реестр и документы расходятся после правок руками; а проверки обещаний («Проверка себя»)
# зависят от машины, а не от кода.
#
# Принципы:
#  * те же проверки, а не «свои»: вызываются уже существующие workflow через workflow_call,
#    чтобы ночной прогон не разошёлся с обычным и не начал жить своей жизнью;
#  * ничего не публикуется и не удаляется: только чтение репозитория и запуск тестов;
#  * падение видно сразу: job называется `nightly`, и красный крестик в списке прогонов —
#    это и есть отчёт.

name: nightly

on:
  schedule:
    # 03:40 UTC — до утренних коммитов и после ночной уборки хранилища.
    - cron: "40 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    name: nightly · ядро и интерфейс
    uses: ./.github/workflows/app.yml
  validate:
    name: nightly · данные и документы
    uses: ./.github/workflows/validate.yml
